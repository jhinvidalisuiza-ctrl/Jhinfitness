<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JhinFitness — Iniciar Sesión</title>
  <meta name="description" content="Inicia sesión en JhinFitness para acceder a tu plan de dietas y nutrición." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green:      #3a9e3f;
      --green-dark: #2d7a32;
      --green-light:#4cbe52;
      --navy:       #1a2d6e;
      --navy-dark:  #111f50;
      --navy-mid:   #1e3580;
    }

    body {
      font-family: 'Figtree', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--navy-dark) 0%, #0a1a3a 40%, #0a2010 100%);
      position: relative;
      overflow: hidden;
    }

    /* Animated background circles */
    body::before {
      content: '';
      position: fixed;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(58,158,63,0.12) 0%, transparent 70%);
      top: -150px; right: -150px;
      border-radius: 50%;
      animation: pulse 6s ease-in-out infinite;
    }
    body::after {
      content: '';
      position: fixed;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(26,45,110,0.2) 0%, transparent 70%);
      bottom: -150px; left: -150px;
      border-radius: 50%;
      animation: pulse 8s ease-in-out infinite reverse;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.15); opacity: 1; }
    }

    .login-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      padding: 20px;
    }

    /* Logo area */
    .login-logo {
      text-align: center;
      margin-bottom: 32px;
      animation: fadeDown 0.6s ease both;
    }
    .login-logo img {
      height: 110px;
      object-fit: contain;
      filter: drop-shadow(0 4px 16px rgba(58,158,63,0.4));
    }
    .login-tagline {
      display: block;
      color: rgba(255,255,255,0.55);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-top: 8px;
    }

    /* Card */
    .login-card {
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 40px 36px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.08);
      animation: fadeUp 0.6s ease 0.1s both;
    }

    .login-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      color: #fff;
      margin-bottom: 6px;
    }
    .login-subtitle {
      font-size: 13px;
      color: rgba(255,255,255,0.5);
      margin-bottom: 32px;
    }

    /* Form */
    .form-group {
      margin-bottom: 20px;
    }
    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: rgba(255,255,255,0.7);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
    }
    .input-wrap {
      position: relative;
    }
    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255,255,255,0.35);
      font-size: 15px;
      pointer-events: none;
    }
    .form-input {
      width: 100%;
      background: rgba(255,255,255,0.07);
      border: 1.5px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      padding: 14px 14px 14px 42px;
      color: #fff;
      font-family: 'Figtree', sans-serif;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.25s ease;
      outline: none;
    }
    .form-input::placeholder { color: rgba(255,255,255,0.3); }
    .form-input:focus {
      border-color: var(--green);
      background: rgba(58,158,63,0.08);
      box-shadow: 0 0 0 3px rgba(58,158,63,0.15);
    }
    .toggle-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: rgba(255,255,255,0.35);
      cursor: pointer;
      font-size: 15px;
      transition: color 0.2s;
      padding: 4px;
    }
    .toggle-password:hover { color: rgba(255,255,255,0.7); }

    /* Error message */
    .error-msg {
      display: none;
      align-items: center;
      gap: 8px;
      background: rgba(227,30,36,0.12);
      border: 1px solid rgba(227,30,36,0.3);
      border-radius: 8px;
      padding: 10px 14px;
      color: #ff6b6b;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 20px;
    }
    .error-msg.show { display: flex; animation: shake 0.4s ease; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    /* Submit button */
    .btn-login {
      width: 100%;
      background: linear-gradient(135deg, var(--green) 0%, var(--green-dark) 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 15px;
      font-family: 'Figtree', sans-serif;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 6px 24px rgba(58,158,63,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 8px;
    }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 32px rgba(58,158,63,0.5);
    }
    .btn-login:active { transform: translateY(0); }
    .btn-login.loading { opacity: 0.75; pointer-events: none; }
    .btn-login .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    .btn-login.loading .spinner { display: block; }
    .btn-login.loading .btn-text { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Footer */
    .login-footer {
      text-align: center;
      margin-top: 24px;
      color: rgba(255,255,255,0.35);
      font-size: 12px;
    }
    .login-footer a { color: var(--green); text-decoration: none; }
    .login-footer a:hover { text-decoration: underline; }

    /* Animations */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Green dot decoration */
    .dot-deco {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-bottom: 20px;
    }
    .dot-deco span {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--green);
      opacity: 0.5;
    }
    .dot-deco span:nth-child(2) { opacity: 0.8; transform: scale(1.3); }
  </style>
</head>
<body>

  <div class="login-wrapper">

    <!-- Logo -->
    <div class="login-logo">
      <img src="logo.png" alt="JhinFitness" />
      <span class="login-tagline">Dietas y Nutrición Saludable</span>
    </div>

    <!-- Card -->
    <div class="login-card">

      <h1 class="login-title">Bienvenido 👋</h1>
      <p class="login-subtitle">Ingresa tus datos para acceder a tu plan.</p>

      <div class="dot-deco">
        <span></span><span></span><span></span>
      </div>

      <!-- Error -->
      <div class="error-msg" id="error-msg">
        <i class="fas fa-exclamation-circle"></i>
        <span id="error-text">Usuario o contraseña incorrectos.</span>
      </div>

      <!-- Form -->
      <form id="login-form" onsubmit="handleLogin(event)">

        <div class="form-group">
          <label class="form-label" for="username">Usuario</label>
          <div class="input-wrap">
            <i class="fas fa-user input-icon"></i>
            <input
              type="text"
              id="username"
              class="form-input"
              placeholder="Tu nombre de usuario"
              autocomplete="username"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Contraseña</label>
          <div class="input-wrap">
            <i class="fas fa-lock input-icon"></i>
            <input
              type="password"
              id="password"
              class="form-input"
              placeholder="Tu contraseña"
              autocomplete="current-password"
              required
            />
            <button type="button" class="toggle-password" id="toggle-pw" onclick="togglePassword()">
              <i class="fas fa-eye" id="pw-icon"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-login" id="btn-login">
          <div class="spinner"></div>
          <span class="btn-text"><i class="fas fa-sign-in-alt"></i> Ingresar a mi plan</span>
        </button>

      </form>

    </div>

    <div class="login-footer">
      ¿Problemas para ingresar? <a href="mailto:soporte@jhinfitness.com">Contáctanos</a>
      <br><br>
      © 2025 JhinFitness · Todos los derechos reservados
    </div>

  </div>

  <!-- Firebase App (the core Firebase SDK) is always required and must be listed first -->
  <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-app-compat.js"></script>
  <!-- Add Firebase products that you want to use -->
  <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore-compat.js"></script>
  <script src="auth.js"></script>
  <script>
    // Redirect if already logged in
    if (AUTH.getSession()) {
      window.location.href = 'index.html';
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-login');
      const errorDiv = document.getElementById('error-msg');
      const errorText = document.getElementById('error-text');
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      // Show loading
      btn.classList.add('loading');
      errorDiv.classList.remove('show');

      try {
        const result = await AUTH.login(username, password);
        btn.classList.remove('loading');

        if (result.ok) {
          btn.innerHTML = '<i class="fas fa-check"></i> <span class="btn-text">¡Bienvenido!</span>';
          btn.style.background = 'linear-gradient(135deg, #2d7a32, #1a5c1e)';
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 800);
        } else {
          errorDiv.classList.remove('show');
          void errorDiv.offsetWidth; // force reflow for animation
          errorText.textContent = result.error || 'Usuario o contraseña incorrectos.';
          errorDiv.classList.add('show');
          btn.classList.remove('loading');
          document.getElementById('password').value = '';
          document.getElementById('password').focus();
        }
      } catch (err) {
        btn.classList.remove('loading');
        errorDiv.classList.add('show');
        errorText.textContent = 'Error de conexión.';
      }
    }

    function togglePassword() {
      const pw = document.getElementById('password');
      const icon = document.getElementById('pw-icon');
      if (pw.type === 'password') {
        pw.type = 'text';
        icon.className = 'fas fa-eye-slash';
      } else {
        pw.type = 'password';
        icon.className = 'fas fa-eye';
      }
    }
  </script>

</body>
</html>
